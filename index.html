<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>토타시 영어</title>
<meta name="theme-color" content="#dfe8f5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="home">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fb7ff"/><stop offset="1" stop-color="#2b63e0"/></linearGradient>
<linearGradient id="g-violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b79bff"/><stop offset="1" stop-color="#6a45e6"/></linearGradient>
<linearGradient id="g-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9e80"/><stop offset="1" stop-color="#e8453c"/></linearGradient>
<linearGradient id="g-mint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fe6b8"/><stop offset="1" stop-color="#109a78"/></linearGradient>
<linearGradient id="g-amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd76a"/><stop offset="1" stop-color="#f08a12"/></linearGradient>
<linearGradient id="g-gray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9c4d2"/><stop offset="1" stop-color="#65728a"/></linearGradient>
<linearGradient id="g-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".65"/><stop offset=".48" stop-color="#fff" stop-opacity=".08"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs></svg>
<div id="app">
  <aside id="hero">
    <div id="toto" role="img" aria-label="토타시"><div id="totoBody"></div></div>
    <div id="bubble" role="status" aria-live="polite"><p id="bubbleText"></p></div>
  </aside>
  <main id="panel"><div id="vc" hidden></div><div id="body"></div><nav id="tabs" aria-label="메뉴"><i class="thumb"></i><button data-tab="home">홈</button><button data-tab="menu">학습</button><button data-tab="records">기록</button><button data-tab="settings">설정</button></nav></main>
  <div id="dockSlot"></div>
</div>
<script src="srs.js"></script>
<script src="voice.js"></script>
<script src="app.js"></script>
</body>
</html>
